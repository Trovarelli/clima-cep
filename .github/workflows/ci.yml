name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - run: go mod download

      - name: Run tests with coverage
        run: go test -v -race -cover ./...

      - name: Build binary
        run: go build -v ./cmd/server
